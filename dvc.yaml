stages:
  # Upstream feature builds. They read data/validated (the full GX-validated month),
  # which is regenerated by ingestion + validation — not shipped in the demo repo.
  # Marked `frozen` so `dvc repro` treats their outputs as pinned snapshots and does
  # NOT try to rebuild them. Unfreeze (or `dvc repro -f <stage>`) when you have fresh
  # validated data and want to regenerate the features.
  build_features:
    cmd: python src/3_feature_engineering/1_build_features.py
    frozen: true
    deps:
    - data/validated
    - src/3_feature_engineering/1_build_features.py
    outs:
    - data/features/march_2025_eda/march_2025_prepared.parquet

  prepare_feast_data:
    cmd: python src/3_feature_engineering/2_prepare_feast_data.py
    deps:
    - data/features/march_2025_eda/march_2025_prepared.parquet
    - src/3_feature_engineering/2_prepare_feast_data.py
    outs:
    - my_feature_store/feature_repo/data/march_2025_features.parquet

  train:
    cmd: python src/4_training/1_train.py
    deps:
    - src/4_training/1_train.py
    - src/splits.py
    - my_feature_store/feature_repo/data/march_2025_features.parquet
    outs:
    - models/model.pkl:
        persist: true
    metrics:
    - metrics.json:
        cache: false

  evaluate:
    cmd: python src/5_evaluation/1_evaluate.py
    deps:
    - src/5_evaluation/1_evaluate.py
    - src/4_training/1_train.py
    - models/model.pkl
    - my_feature_store/feature_repo/data/march_2025_features.parquet
    metrics:
    - eval_metrics.json:
        cache: false

  promote:
    cmd: python src/6_promotion/1_promote_model.py
    deps:
    - src/6_promotion/1_promote_model.py
    - eval_metrics.json
    metrics:
    - promote_report.json:
        cache: false
