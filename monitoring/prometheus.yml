global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gmr-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["gmr-app:8000"]

  - job_name: "mlflow"
    static_configs:
      - targets: ["mlflow:5000"]
